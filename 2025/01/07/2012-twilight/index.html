    <h1 class="post-page-title">黎明 或 2012</h1>
    <time class="post-date" datetime="2025-01-07T10:43:09.000Z">2025.01.07</time>
  </header>
  
  <div class="post-content post-reading-body"><span id="more"></span>

<blockquote>
<p>舊詩一首</p>
</blockquote>
<p>淺灘上 一群猴子說教<br>太陽未生的角落<br>玻璃杯破碎 火球燃燒<br>門外守著 枯萎的向日葵<br>熟稔的幽谷<br>光在其中窒息</p>
<p>然後 我嗅到了炊煙<br>黎明未造訪的人間<br>雞鳴、柴香中的生活<br>人在其中重生<br>停電的山村迴歸原始<br>黑夜吞噬<br>一盆熱汽和滾燙的水<br>卻是思鄉的罪因</p>
<p>你說：一切往事都在夢中<br>幻影中 我聽見——<br>摩托和戒尺<br>喧譁的收音機<br>黎明在流血<br>傷痕滾燙 淌著東方的雲<br>可我卻期待黎明殞命：<br>獻祭給了今天 才有明天</p>
<p>小滿 2024&#x2F;1&#x2F;23 夜</p>
