    <h1 class="post-page-title">太陽、潮落</h1>
    <time class="post-date" datetime="2024-01-01T02:45:09.000Z">2024.01.01</time>
  </header>
  
  <div class="post-content post-reading-body"><span id="more"></span>

<p>太陽<br>請給冬日動人的悲憫<br>你是空有光明的夜燈<br>無力帶給寒天一絲暖意</p>
<p>太陽<br>請把生命留在白晝<br>你是將遭審判的囚徒<br>決絕將赴星月的刑場</p>
<p>太陽，偉大的事業未竟<br>你曾搏擊北風，怒斥冬的不公<br>你曾笑對雪花妖冶的輕蔑<br>你是荒嶺上的黃花<br>註定你的努力不合時宜</p>
<p>我在太陽中看見了我的生命<br>吶喊，口旁升騰的霧氣<br>是傳書於你的白鴿<br>聆聽我的呼喚，太陽<br>我心意已決<br>請與我在海邊坐待潮落</p>
