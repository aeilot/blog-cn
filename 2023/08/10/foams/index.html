    <h1 class="post-page-title">泡沫</h1>
    <time class="post-date" datetime="2023-08-10T07:45:09.000Z">2023.08.10</time>
  </header>
  
  <div class="post-content post-reading-body"><span id="more"></span>

<blockquote>
<p>只恨一切都成了泡沫……</p>
</blockquote>
<p>浪宣告朗，日光下，<br>我試著抓住大海——它<br>卻後退，化身成點點泡沫。</p>
<p>海波泛起星光閃爍，<br>如秋波傳情勾起那些緬邈之懷。<br>這次，要抓牢——<br>海無情，夕有情，<br>斜陽下，攥住一手細沙，金黃。</p>
<p>奔走，奔走，向大海，<br>跟隨泡沫的蹤跡。<br>前行，浪宣告朗，<br>拽住浪花似TA的衣袖，<br>只恨，跌倒，潮退，<br>失去。<br>迷茫。</p>
<p>泡沫，泡沫，<br>如今我兩手空空。<br>“雖不能至，然心嚮往之。”<br>或許會隨波流浪，<br>去大海深處，<br>去尋覓你，<br>尋覓浪聲依舊。</p>
