  <div class="post-content post-reading-body"><p>我打江南走過<br>那等在季節裡的容顏如蓮花的開落</p>
<span id="more"></span>
<br>
東風不來，三月的柳絮不飛
<br>
你底心如小小的寂寞的城
<br>
恰若青石的街道向晚
<br>
跫音不響，三月的春帷不揭
<br>
你底心是小小的窗扉緊掩
<br>
<br>
我達達的馬蹄是美麗的錯誤
<br>
我不是歸人，是個過客……
